# 局域网部署专用 compose
#
# 与 docker-compose.yaml（拉上游 GHCR 镜像的"使用者"版本）的关键区别：
#   1. build: .     —— 构建**本仓库**的代码，而不是拉上游镜像。二次开发的改动只有
#                      这样才会生效。docker-compose.yaml 里没有 build 段，
#                      `docker compose up -d` 会把官方镜像拉下来跑，改动一行都不生效。
#   2. 端口绑 0.0.0.0 —— 局域网内其它机器可访问。默认那份只绑 127.0.0.1（仅本机）。
#   3. 挂载 ./.env   —— Web UI 里保存的通知/AI 设置是写回 .env 文件的（就地截断写入，
#                      不是原子替换，因此 bind mount 能正常同步）。不挂载的话，
#                      `docker compose up --build` 重建容器后这些设置会丢失。
#
# 使用前必须做两件事：
#   - 先在宿主机建好 .env（至少 OPENAI_*、WEB_PASSWORD）与确认 config.json 是**文件**。
#     这两个路径是单文件挂载，若宿主机上不存在，Docker 会创建一个**同名目录**顶上去，
#     应用随后读配置就会出错。
#   - WEB_PASSWORD 必须改成非默认值。默认 admin/admin123 是公开文档里的值，
#     一旦绑到 0.0.0.0 就等于把管理接口敞开给整个局域网。
#
#   启动：docker compose -f docker-compose.lan.yaml up -d --build
#   日志：docker compose -f docker-compose.lan.yaml logs -f app
#   停止：docker compose -f docker-compose.lan.yaml down

services:
  app:
    build: .
    image: ai-goofish-monitor:lan
    container_name: ai-goofish-monitor-app
    # 刻意不写 init: true：镜像的 ENTRYPOINT 本身就是 tini，若再加 Docker 注入的
    # init，容器里会同时有两个 tini——Docker 的那个占 PID 1，镜像里的退到 PID 7，
    # 于是启动时打印 "Tini is not running as PID 1 ... zombie reaping won't work"。
    # 去掉后镜像自带的 tini 就是 PID 1，僵尸进程回收照常工作，日志也干净。
    ports:
      # 绑所有网卡，宿主端口可用 APP_PORT 覆盖（例：APP_PORT=9000 docker compose -f ... up -d）。
      # 只给部分网段访问请写具体地址，例如 "192.168.1.10:8000:8000"。
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # 容器内工作目录是 /app，SQLite 落在挂载出来的 ./data 上，重建容器不丢数据。
      APP_DATABASE_FILE: /app/data/app.sqlite3
      TZ: Asia/Shanghai
      # 把容器内监听端口钉死成 8000：environment 的优先级高于 env_file，所以即使 .env
      # 里写了 SERVER_PORT=9000 也不会把容器内的监听端口改掉（那会导致端口映射对不上，
      # 表现为"容器起来了但连不上"）。要在宿主机换端口请用上面的 APP_PORT。
      SERVER_PORT: "8000"
    volumes:
      # 单文件挂载：宿主机上必须已存在，否则会被建成目录。
      #
      # 结尾的 :z 是给 SELinux 主机（Fedora / RHEL / Rocky / Alma 等）用的共享标签；
      # 不启用 SELinux 的系统（Ubuntu / Debian / macOS）会忽略它，无副作用。
      # 缺了它，在 SELinux enforcing 的机器上容器会读不到挂载进来的文件，
      # 表现为 .env 配置为空、登录态文件报不存在。
      - ./.env:/app/.env:z
      - ./config.json:/app/config.json:z
      # 从 Web UI 导入的登录态写的是工作目录下的 xianyu_state.json（文件名在该接口里
      # 是写死的，不受 STATE_FILE 影响）。不挂出来的话它只存在于容器可写层，
      # 一旦 down / up --build 重建容器就没了，得重新从浏览器导出 cookie。
      # 首次部署前先在宿主机建好：echo '{}' > xianyu_state.json
      - ./xianyu_state.json:/app/xianyu_state.json:z
      # 目录挂载：不存在时 Docker 会自动创建空目录。
      - ./data:/app/data:z
      - ./state:/app/state:z
      - ./prompts:/app/prompts:z
      - ./jsonl:/app/jsonl:z
      - ./logs:/app/logs:z
      - ./images:/app/images:z
      - ./price_history:/app/price_history:z
    restart: unless-stopped
