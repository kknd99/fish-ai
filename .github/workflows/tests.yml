name: tests

# 为什么加这个工作流：仓库原有的 CI 只构建镜像、**从不跑测试**（也没有 lint），
# 所以测试用例陈旧、甚至"每次抓取都会 NameError"这类回归都能长期潜伏。
# 这里把 pytest 与前端构建纳入自动检查，作为改动的最低门槛。
#
# 说明：所有 action 都用 commit SHA 固定（可变 tag 可被上游重新指向，
# 等于把任意代码引入 CI）。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        # 不需要 Playwright 浏览器：测试全部离线（真实抓取与模型调用都被打桩/跳过）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行测试
        # PYTEST_DISABLE_PLUGIN_AUTOLOAD 与 README 保持一致；
        # tests/live 在没有 RUN_LIVE_TESTS=1 时会自动跳过（它们需要真实凭据与网络）
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q

      - name: 静态检查（未定义名字 / 未使用导入）
        # pyflakes 的 "undefined name" 已被 tests/unit/test_static_analysis.py 覆盖，
        # 这里额外打印全部告警方便排查（不作为失败条件）
        run: python -m pyflakes src spider_v2.py desktop_launcher.py || true

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: 安装依赖并构建
        # vue-tsc 会做类型检查，因此这一步同时是"前端类型测试"
        working-directory: web-ui
        run: |
          npm ci
          npm run build
